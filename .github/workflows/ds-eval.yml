name: DS Eval Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ds-golden-test:
    name: DS Golden Test (50/50)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install DS dependencies
        run: |
          pip install xgboost scikit-learn vaderSentiment numpy pandas

      - name: Train classifier (if model missing)
        working-directory: backend
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          model_path = 'app/ds/models/startup_classifier.pkl'
          if not os.path.exists(model_path):
              print('[CI] Model not found — training now...')
              from app.ds.classifier import train_and_save
              train_and_save()
              print('[CI] Model trained and saved.')
          else:
              print('[CI] Model already exists — skipping training.')
          "

      - name: Run DS Golden Test
        working-directory: backend/app/ds/eval
        run: |
          python golden.test.py

      - name: Upload golden results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-results
          path: backend/app/ds/eval/results/golden_results.json

  ds-stress-test:
    name: DS Stress Test (50 cases)
    runs-on: ubuntu-latest
    needs: ds-golden-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install DS dependencies
        run: |
          pip install xgboost scikit-learn vaderSentiment numpy pandas

      - name: Train classifier (if model missing)
        working-directory: backend
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          model_path = 'app/ds/models/startup_classifier.pkl'
          if not os.path.exists(model_path):
              from app.ds.classifier import train_and_save
              train_and_save()
          "

      - name: Run DS Stress Test
        working-directory: backend
        run: |
          python app/ds/test_ds_stress.py

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://placeholder.up.railway.app
        run: npm run build
