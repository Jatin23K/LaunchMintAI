name: "CI - Test and Open PR"

on:
  push:
    branches-ignore:
      - master
      - main

jobs:
  frontend:
    name: "Frontend - TypeScript + Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://launchmintai-backend.onrender.com
        run: npm run build

  backend:
    name: "Backend - Import + Dependency check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Import check
        working-directory: backend
        run: python -c "from app.main import app; print('Backend imports OK')"

  open-pr:
    name: "Open Pull Request to master"
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create PR if not already open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          EXISTING=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq length)
          if [ "$EXISTING" -eq 0 ]; then
            gh pr create \
              --base master \
              --head "$BRANCH" \
              --title "ci: $BRANCH -> master" \
              --body "CI passed. TypeScript OK, frontend build OK, backend imports OK. Commit: $SHA. Merge to deploy."
            echo "PR created for $BRANCH"
          else
            echo "PR already open for $BRANCH -- skipping."
          fi
